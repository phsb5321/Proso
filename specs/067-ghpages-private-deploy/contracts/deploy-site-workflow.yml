# Contract: deploy-site.yml workflow specification
# This is the target workflow structure for native GitHub Pages deployment

name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - 'packages/site/**'
      - 'packages/legal/**'
  repository_dispatch:
    types: [release-deployed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Merge site and legal directories
        run: |
          mkdir -p _site
          cp -r packages/site/* _site/
          cp -r packages/legal _site/legal

      - name: Fetch auto-update files from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout origin/gh-pages -- updates.json releases/ 2>/dev/null || true
            [ -f updates.json ] && cp updates.json _site/
            [ -d releases ] && cp -r releases _site/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
