test_patterns:
  - name: "Handler returns Result<T, E>"
    description: "Every handler MUST return a Result type. Test both Ok and Err paths."
    example: |
      it('returns Ok with voices list on success', async () => {
        mockAudioGenerator.getVoices.mockResolvedValue(Ok([mockVoice]));
        const result = await handler({ language: 'en' });
        expect(result).toEqual({ voices: [mockVoice] });
      });

      it('returns error when audio generator fails', async () => {
        mockAudioGenerator.getVoices.mockResolvedValue(Err({ type: 'network', message: 'timeout' }));
        const result = await handler({ language: 'en' });
        expect(result).toEqual({ error: 'network', message: 'timeout' });
      });

  - name: "Handler validates input via Zod"
    description: "Handlers that use Zod schema validation should have tests for invalid input."
    example: |
      it('throws on invalid params', async () => {
        await expect(handler({ speed: -1 })).rejects.toThrow();
      });

  - name: "Handler delegates to correct service"
    description: "Verify the handler calls the expected port/service method."

validation:
  command: "pnpm run test:unit -- --testPathPattern='handlers' --coverage"
  thresholds:
    statements: 80
    branches: 70
    functions: 90
    lines: 80
