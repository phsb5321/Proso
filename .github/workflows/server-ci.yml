name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'

env:
  CI: true
  NODE_VERSION: '20'

jobs:
  server-ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared (if build script exists)
        run: pnpm --filter @proso/shared run --if-present build

      - name: Lint server
        run: pnpm --filter @proso/server lint

      - name: Test server
        run: pnpm --filter @proso/server test

      - name: Build server
        run: pnpm --filter @proso/server build
