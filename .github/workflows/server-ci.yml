name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'

env:
  CI: true
  NODE_VERSION: '20'

jobs:
  server-ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm version pinned by root package.json packageManager field

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared (if build script exists)
        run: pnpm --filter @proso/shared run --if-present build

      - name: Lint server
        run: pnpm --filter @proso/server lint

      - name: Generate Prisma client
        run: pnpm --filter @proso/server prisma:generate

      - name: Test server with coverage
        run: pnpm --filter @proso/server test -- --coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          flags: server
          directory: packages/server/coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build server
        run: pnpm --filter @proso/server build

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true
