# Consolidated CI Workflow
# Feature: 055-automated-testing-ci

name: CI

on:
  push:
    branches:
      - main
      - develop
      - '**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build Firefox
        run: pnpm run build:firefox
      - name: Build Chrome
        run: pnpm run build:chrome
      - name: Validate Firefox manifest
        run: |
          MANIFEST=".output/firefox-mv2/manifest.json"
          if ! jq empty "$MANIFEST" 2>/dev/null; then
            echo "::error::Invalid manifest.json"
            exit 1
          fi
          echo "Manifest valid: $(jq -r '.name + " v" + .version' "$MANIFEST")"
      - name: Check extension size
        run: |
          SIZE=$(du -sb .output/firefox-mv2 | cut -f1)
          if [ $SIZE -gt 5242880 ]; then
            echo "::error::Extension exceeds 5MB limit"
            exit 1
          fi
          echo "Size: $((SIZE / 1024))KB"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-firefox-${{ github.sha }}
          path: .output/firefox-mv2/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: extension-chrome-${{ github.sha }}
          path: .output/chrome-mv3/
          retention-days: 7
