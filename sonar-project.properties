sonar.projectKey=proso
sonar.projectName=Proso
sonar.organization=phsb5321
sonar.sources=packages/extension/src,packages/server/src,packages/shared/src,services/proso-log-gateway/src
sonar.tests=packages/extension/tests,packages/server/tests,packages/shared/tests
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.output/**,**/.wxt/**,**/generated/**,**/*.d.ts,**/prisma/migrations/**,**/coverage/**
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/tests/**,**/mocks/**,**/*.module.ts,**/main.ts,**/main.entry.ts,**/entrypoints/**
sonar.javascript.lcov.reportPaths=packages/extension/coverage/lcov.info,packages/server/coverage/lcov.info
sonar.typescript.tsconfigPaths=packages/extension/tsconfig.json,packages/server/tsconfig.json,packages/shared/tsconfig.json
sonar.sourceEncoding=UTF-8

# Quality gate: fail PR if new bugs > 0, new vulnerabilities > 0, new code smells > 10, new coverage < 60%
# Configure in SonarQube UI: Quality Gates → attach "Sonar way" or custom gate to this project

# Exclude auto-generated Prisma client from duplication analysis
sonar.cpd.exclusions=**/generated/**,**/*.d.ts,**/prisma/**
