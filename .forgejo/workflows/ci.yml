# Runs on the self-hosted Forgejo Actions runner (server host), NOT on GitHub.
#
# GitHub Actions has produced nothing for this repository since 05/08/2026:
# every run is `startup_failure` with 0 jobs, because the block is at the
# DISPATCH layer (account-level). A self-hosted *GitHub* runner cannot help --
# GitHub never creates a job for it to pick up. Forgejo Actions replaces the
# dispatch layer entirely.
#
# Living under `.forgejo/workflows/` (not `.github/workflows/`) is deliberate
# and is the cost control: Forgejo reads this path, GitHub ignores it, so this
# CI can never consume a paid GitHub Actions minute -- including after the
# outstanding invoice is settled and dispatch is restored.
#
# `runs-on: ubuntu-latest` is served by the runner's container label
# (`ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04`), so these
# jobs run verbatim rather than being rewritten against nix toolchains.
# Mirror: NixOS `modules/services/forgejo-mirror.nix` instance `proso`
# pushes GitHub `main` -> Forgejo whenever it advances (SHA-gated).
name: CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'packages/extension/**'
      - 'packages/shared/**'
      - 'packages/server/**'
      - 'pnpm-lock.yaml'
      - '.forgejo/workflows/ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'packages/extension/**'
      - 'packages/shared/**'
      - 'packages/server/**'
      - 'pnpm-lock.yaml'
      - '.forgejo/workflows/ci.yml'

jobs:
  # ============================================
  # Extension Unit Tests + Coverage
  # ============================================
  extension-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @proso/extension lint

      - name: Tests + coverage
        run: pnpm --filter @proso/extension exec jest --coverage
        env:
          NODE_OPTIONS: '--experimental-vm-modules --max-old-space-size=4096'

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          flags: extension
          directory: packages/extension/coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build Firefox extension
        run: pnpm --filter @proso/extension build:firefox

      # Chrome-ready smoke (056 T093): the product is Firefox-first but must
      # stay buildable for Chrome MV3 — fail CI if the Chrome build breaks.
      - name: Build Chrome extension (smoke)
        run: pnpm --filter @proso/extension build:chrome

      # ============================================
      # Firefox Build Validation (041-firefox-first-pivot T4.1)
      # ============================================

      - name: Validate Firefox manifest.json
        run: |
          MANIFEST="packages/extension/.output/firefox-mv2/manifest.json"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: manifest.json not found at $MANIFEST"
            exit 1
          fi

          if ! jq empty "$MANIFEST" 2>/dev/null; then
            echo "ERROR: manifest.json is not valid JSON"
            exit 1
          fi

          MANIFEST_VERSION=$(jq -r '.manifest_version' "$MANIFEST")
          if [ "$MANIFEST_VERSION" != "2" ]; then
            echo "ERROR: manifest_version should be 2 for Firefox MV2, got: $MANIFEST_VERSION"
            exit 1
          fi

          NAME=$(jq -r '.name' "$MANIFEST")
          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            echo "ERROR: name is required in manifest.json"
            exit 1
          fi

          VERSION=$(jq -r '.version' "$MANIFEST")
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: version is required in manifest.json"
            exit 1
          fi

          GECKO_ID=$(jq -r '.browser_specific_settings.gecko.id // .applications.gecko.id' "$MANIFEST")
          if [ -z "$GECKO_ID" ] || [ "$GECKO_ID" = "null" ]; then
            echo "ERROR: gecko.id is required for Firefox extensions"
            exit 1
          fi

          echo "Manifest validation passed (v$VERSION, gecko: $GECKO_ID)"

      - name: Validate required Firefox files
        run: |
          BUILD_DIR="packages/extension/.output/firefox-mv2"
          MISSING_FILES=0

          for file in manifest.json background.js popup.html settings.html; do
            if [ -f "$BUILD_DIR/$file" ]; then
              echo "  $file OK"
            else
              echo "  $file MISSING"
              MISSING_FILES=$((MISSING_FILES + 1))
            fi
          done

          if [ -d "$BUILD_DIR/icons" ]; then
            echo "  icons/ OK"
          else
            echo "  icons/ MISSING"
            MISSING_FILES=$((MISSING_FILES + 1))
          fi

          if [ $MISSING_FILES -gt 0 ]; then
            echo "ERROR: $MISSING_FILES required file(s) missing"
            exit 1
          fi

          echo "All required files present"

      - name: Check Firefox extension size
        run: |
          BUILD_DIR="packages/extension/.output/firefox-mv2"
          TOTAL_SIZE=$(du -sb "$BUILD_DIR" | cut -f1)
          TOTAL_SIZE_MB=$((TOTAL_SIZE / 1048576))

          echo "Extension size: ${TOTAL_SIZE_MB}MB ($TOTAL_SIZE bytes)"

          if [ $TOTAL_SIZE -gt 5242880 ]; then
            echo "ERROR: Extension exceeds 5MB limit"
            exit 1
          fi

          if [ $TOTAL_SIZE -gt 4194304 ]; then
            echo "WARNING: Extension approaching 5MB limit"
          fi

      - name: Quality check
        run: pnpm --filter @proso/extension quality

  # ============================================
  # Server Unit Tests + Coverage
  # ============================================
  server-test:
    runs-on: ubuntu-latest
    # The Prisma contract specs need a real PostgreSQL. They used to reach for
    # testcontainers, which needs a docker socket the test process can reach --
    # impossible from inside a job that is itself a container, so they failed on
    # the first self-hosted run and were previously recorded as
    # "environment-blocked". Provisioning the database HERE and handing it over
    # as TEST_DATABASE_URL lets those specs run unchanged, so the 23 Prisma
    # contracts gate in CI instead of being skipped everywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: proso_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@postgres:5432/proso_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @proso/shared run --if-present build

      - name: Lint server
        run: pnpm --filter @proso/server lint

      - name: Generate Prisma client
        run: pnpm --filter @proso/server prisma:generate

      - name: Test server with coverage
        run: pnpm --filter @proso/server test --coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          flags: server
          directory: packages/server/coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build server
        run: pnpm --filter @proso/server build

  # ============================================
  # Security Audit
  # ============================================
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # ============================================
  # Firefox Visual Tests (041-firefox-first-pivot T4.2)
  # ============================================
  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: extension-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @proso/extension exec -- playwright install firefox --with-deps

      - name: Run Firefox visual tests
        run: pnpm --filter @proso/extension test:visual
        continue-on-error: true

      - name: Upload visual test report
        uses: actions/upload-artifact@v4
        # Diagnostics, never a gate. Forgejo's artifact backend rejects the
        # upload-artifact@v4 protocol (`GHESNotSupportedError`), which failed
        # visual-tests and e2e-tests as a whole even though the suites
        # themselves had already reported. An artifact upload must not be able
        # to redden a job whose tests passed.
        continue-on-error: true
        if: always()
        with:
          name: playwright-visual-report
          path: |
            packages/extension/playwright-report/
            packages/extension/test-results/
          retention-days: 14

      - name: Upload snapshot diffs
        uses: actions/upload-artifact@v4
        # Diagnostics, never a gate. Forgejo's artifact backend rejects the
        # upload-artifact@v4 protocol (`GHESNotSupportedError`), which failed
        # visual-tests and e2e-tests as a whole even though the suites
        # themselves had already reported. An artifact upload must not be able
        # to redden a job whose tests passed.
        continue-on-error: true
        if: failure()
        with:
          name: snapshot-diffs
          path: packages/extension/test-results/**/*-diff.png
          retention-days: 7

  # ============================================
  # Extension E2E Tests (Chromium)
  # ============================================
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: extension-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @proso/extension exec -- playwright install chromium --with-deps

      # The chromium-extension fixture loads .output/chrome-mv3 (not firefox-mv2),
      # so the E2E job must build the Chrome target, not Firefox.
      - name: Build Chrome extension
        run: pnpm --filter @proso/extension build:chrome

      - name: Run extension E2E tests
        run: pnpm --filter @proso/extension test:e2e:ext

      - name: Upload E2E test report
        uses: actions/upload-artifact@v4
        # Diagnostics, never a gate. Forgejo's artifact backend rejects the
        # upload-artifact@v4 protocol (`GHESNotSupportedError`), which failed
        # visual-tests and e2e-tests as a whole even though the suites
        # themselves had already reported. An artifact upload must not be able
        # to redden a job whose tests passed.
        continue-on-error: true
        if: always()
        with:
          name: playwright-e2e-report
          path: |
            packages/extension/playwright-report/
            packages/extension/test-results/
          retention-days: 14
