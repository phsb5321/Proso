<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Waveform decoration -->
  <g transform="translate(100, 480)" opacity="0.3">
    <rect x="0" y="0" width="4" height="60" rx="2" fill="#f59e0b"/>
    <rect x="12" y="-20" width="4" height="100" rx="2" fill="#f59e0b"/>
    <rect x="24" y="-10" width="4" height="80" rx="2" fill="#f59e0b"/>
    <rect x="36" y="-30" width="4" height="120" rx="2" fill="#06b6d4"/>
    <rect x="48" y="-15" width="4" height="90" rx="2" fill="#06b6d4"/>
    <rect x="60" y="-25" width="4" height="110" rx="2" fill="#f59e0b"/>
    <rect x="72" y="-5" width="4" height="70" rx="2" fill="#06b6d4"/>
    <rect x="84" y="-35" width="4" height="130" rx="2" fill="#f59e0b"/>
    <rect x="96" y="-10" width="4" height="80" rx="2" fill="#06b6d4"/>
    <rect x="108" y="-20" width="4" height="100" rx="2" fill="#f59e0b"/>
  </g>

  <g transform="translate(960, 480)" opacity="0.3">
    <rect x="0" y="-10" width="4" height="80" rx="2" fill="#06b6d4"/>
    <rect x="12" y="-25" width="4" height="110" rx="2" fill="#f59e0b"/>
    <rect x="24" y="-5" width="4" height="70" rx="2" fill="#06b6d4"/>
    <rect x="36" y="-35" width="4" height="130" rx="2" fill="#f59e0b"/>
    <rect x="48" y="-15" width="4" height="90" rx="2" fill="#06b6d4"/>
    <rect x="60" y="-30" width="4" height="120" rx="2" fill="#f59e0b"/>
    <rect x="72" y="0" width="4" height="60" rx="2" fill="#06b6d4"/>
    <rect x="84" y="-20" width="4" height="100" rx="2" fill="#f59e0b"/>
    <rect x="96" y="-10" width="4" height="80" rx="2" fill="#06b6d4"/>
    <rect x="108" y="-25" width="4" height="110" rx="2" fill="#f59e0b"/>
  </g>

  <!-- Logo -->
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#e8e8ec">
    Vox<tspan fill="#f59e0b">Page</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#a0a0b4">
    Listen to the web. Your way.
  </text>

  <!-- Subtitle -->
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#6b6b80">
    Open-source text-to-speech for Firefox with AI voices
  </text>

  <!-- Accent line -->
  <rect x="450" y="400" width="300" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Badge pills -->
  <g transform="translate(300, 440)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="none" stroke="#2a2a42" stroke-width="1"/>
    <text x="70" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#a0a0b4">AGPL-3.0</text>
  </g>
  <g transform="translate(460, 440)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="none" stroke="#2a2a42" stroke-width="1"/>
    <text x="70" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#a0a0b4">Privacy First</text>
  </g>
  <g transform="translate(620, 440)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="none" stroke="#2a2a42" stroke-width="1"/>
    <text x="70" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#a0a0b4">Free Forever</text>
  </g>
</svg>
